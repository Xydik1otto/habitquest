name: iOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web deps and sync Capacitor
        run: |
          npm ci
          npx cap sync ios

      - name: CocoaPods install
        run: |
          pod --version || sudo gem install cocoapods
          cd ios/App && pod install

      - name: xcodebuild (unsigned, device)
        run: >
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App
          -configuration Release -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          -derivedDataPath ios/build build

      - name: Zip unsigned .app (AltStore/Sideloadly-ready)
        run: >
          cd ios/build/Build/Products/Release-iphoneos &&
          zip -qry "$GITHUB_WORKSPACE/habitquest-ios-unsigned.zip" App.app

      - name: Upload unsigned .app zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: habitquest-ios-unsigned
          path: habitquest-ios-unsigned.zip
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} habitquest-ios-unsigned.zip --repo ${{ github.repository }} --clobber
