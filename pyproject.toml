[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "habitquest"
version = "1.0.0"
description = "Local-first gamified habit tracker: XP, levels, streaks, boss battles. No cloud, no subscriptions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "habitquest contributors" }]
keywords = ["habits", "gamification", "self-improvement", "fastapi", "pwa", "local-first"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Ukrainian",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
habitquest = "app.cli:main"

[project.urls]
Homepage = "https://github.com/example/habitquest"
Changelog = "https://github.com/example/habitquest/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["*.json"]
