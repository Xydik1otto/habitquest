<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12121a">
<title>habitquest</title>
<meta name="description" content="Локальний геймфікований трекер звичок: XP, рівні, бос-бої, стрики. Без хмари й підписок.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="HabitQuest">
<meta property="og:title" content="⚔️ HabitQuest — звички як RPG">
<meta property="og:description" content="Локальний геймфікований трекер звичок: XP, рівні, бос-бої, стрики. Без хмари й підписок.">
<meta property="og:image" content="/static/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="⚔️ HabitQuest — звички як RPG">
<meta name="twitter:description" content="Локальний геймфікований трекер звичок: XP, рівні, бос-бої, стрики.">
<link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
<link rel="alternate icon" href="/static/icons/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>⚔️ HabitQuest</h1>
  <div id="player-bar">
    <span id="level-badge"></span>
    <div id="xp-bar"><div id="xp-fill"></div></div>
    <span id="xp-text"></span>
  </div>
</header>

<main>
  <section class="panel">
    <h2>💬 Цитата дня</h2>
    <blockquote id="quote" class="quote"><span id="quote-text">…</span><footer id="quote-author"></footer></blockquote>
  </section>

  <section class="panel">
    <h2>📚 Шаблони звичок</h2>
    <div id="templates" class="templates"></div>
  </section>

  <section class="panel">
    <h2>Сьогодні</h2>
    <div id="cat-filter" class="cat-filter"></div>
    <div id="day-list"></div>
    <form id="new-habit">
      <input id="h-name" placeholder="Нова звичка…" required maxlength="80">
      <input id="h-icon" value="✅" maxlength="4" title="Емодзі-іконка">
      <select id="h-category" title="Категорія">
        <option value="health">💚 Здоров'я</option>
        <option value="mind">🧠 Розум</option>
        <option value="work">💼 Робота</option>
        <option value="home">🏠 Дім</option>
      </select>
      <select id="h-schedule">
        <option value="daily">Щодня</option>
        <option value="weekly">Щотижня</option>
      </select>
      <input id="h-target" type="number" min="1" max="7" value="1" title="Ціль за період">
      <button type="submit">Додати</button>
    </form>
  </section>

  <section class="panel">
    <h2>🗡 Бос-бій цього місяця</h2>
    <div id="quest-list"></div>
    <form id="new-quest">
      <select id="q-habit" required></select>
      <input id="q-target" type="number" min="1" max="31" value="12" title="Скільки разів за місяць">
      <button type="submit">⚔ Викликати боса</button>
    </form>
  </section>

  <section class="panel">
    <h2>📅 Тижневий квест</h2>
    <div id="weekly-quests"></div>
    <form id="new-weekly-quest">
      <select id="wq-h1" required></select>
      <select id="wq-h2" required></select>
      <select id="wq-h3" required></select>
      <input id="wq-target" type="number" min="1" max="7" value="5" title="Разів за тиждень на кожну звичку">
      <button type="submit">📅 Створити</button>
    </form>
  </section>

  <section class="panel">
    <h2>Тиждень (heatmap)</h2>
    <div id="week-heatmap"></div>
  </section>

  <section class="panel">
    <h2>📈 Дашборд (30 днів)</h2>
    <div id="dashboard"></div>
  </section>

  <section class="panel">
    <h2>📊 Підсумок місяця</h2>
    <div class="recap-controls">
      <input id="recap-month" type="month">
      <button id="recap-load">Показати</button>
    </div>
    <div id="recap"></div>
  </section>

  <section class="panel">
    <h2>🏆 Редактор досягнень</h2>
    <div id="achv-editor-list"></div>
    <form id="achv-form">
      <input id="a-id" placeholder="id (напр. night_owl)" required maxlength="64" pattern="[a-z0-9_]+">
      <input id="a-name" placeholder="Назва" required maxlength="80">
      <input id="a-desc" placeholder="Опис" maxlength="200">
      <select id="a-metric" title="Метрика">
        <option value="streak">Серія (днів)</option>
        <option value="total_checkins">Усього чек-інів</option>
        <option value="gap_days">Пауза (днів)</option>
      </select>
      <input id="a-threshold" type="number" min="1" value="10" title="Поріг">
      <button type="submit" id="a-submit">Додати</button>
    </form>
  </section>

  <section class="panel">
    <h2>Статистика</h2>
    <div id="stats"></div>
    <div id="shop" class="shop"></div>
    <div id="badges"></div>
    <div class="portability">
      <button id="btn-export">⬇ Export JSON</button>
      <label>⬆ Import <input type="file" id="import-file" accept="application/json" hidden></label>
    </div>
    <div id="achievements"></div>
    <div id="settings" class="settings"></div>
  </section>
</main>

<div id="levelup"><span id="levelup-text"></span></div>

<script src="/static/app.js"></script>
</body>
</html>
